<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc"><title id="title">Content hubs: identity, navigation and delivery</title><desc id="desc">Three experience patterns: a parent website, a content hub within its parent, and a distinct microsite. Below, a hub page divides parent identity, local navigation, ancestry, and page content. Delivery technology is an independent choice.</desc><rect width="1440" height="1240" fill="#faf9f5"/><style>text{font-family:Arial,sans-serif;fill:#263b43}.title{font-size:34px;font-weight:700}.h{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.label{font-size:14px;letter-spacing:1.4px;font-weight:700}.line{stroke:#73858b;stroke-width:1.4;fill:none}.box{fill:#fff;stroke:#73858b;stroke-width:1.4}.accent{fill:#dcece9}.muted{fill:#eaeef0}</style><text x="48" y="56" class="title">A place within the parent site</text><text x="48" y="89" class="body">Working sketch • Mangrove • 9 September 2026 • Patterns, not a technology ladder</text><rect x="48" y="122" width="432" height="285" rx="8" class="box"/><text x="68" y="156" class="h">Parent website</text><text x="68" y="186" class="small">Broad identity and discovery</text><rect x="68" y="204" width="392" height="37" rx="8" class="muted"/><text x="80" y="229" class="small">Parent identity</text><text x="76" y="269" class="body">Global navigation</text><path d="M68 283 L460 283" class="line"/><text x="76" y="321" class="body">Topic landing pages</text><text x="76" y="355" class="small">News · resources · programmes</text><rect x="504" y="122" width="432" height="285" rx="8" class="box"/><text x="524" y="156" class="h">Content hub</text><text x="524" y="186" class="small">A named collection with lateral routes</text><rect x="524" y="204" width="392" height="37" rx="8" class="muted"/><text x="536" y="229" class="small">Parent identity</text><rect x="524" y="253" width="392" height="64" rx="8" class="accent"/><text x="536" y="280" class="body">Sendai Framework Monitor</text><text x="536" y="303" class="small">Overview   Reporting   Data</text><text x="532" y="355" class="small">Related pages retain this local identity</text><rect x="960" y="122" width="432" height="285" rx="8" class="box"/><text x="980" y="156" class="h">Microsite</text><text x="980" y="186" class="small">A more distinct experience</text><rect x="980" y="204" width="392" height="37" rx="8" class="muted"/><text x="992" y="229" class="small">Parent identity</text><rect x="980" y="253" width="392" height="64" rx="8" class="accent"/><text x="992" y="280" class="body">Distinct campaign / resource identity</text><text x="992" y="303" class="small">Its own navigation and composition</text><text x="988" y="355" class="small">Still offers a clear parent-site connection</text><text x="48" y="448" class="h">Independent choice: how it is published</text><rect x="48" y="466" width="1344" height="63" rx="8" class="muted"/><text x="70" y="493" class="body">Existing Drupal site  /  static microsite tooling  /  another application</text><text x="70" y="517" class="small">Content relationships do not prescribe a CMS, a new domain, or a separate build.</text><text x="48" y="578" class="h">One hub, different page needs</text><rect x="48" y="600" width="880" height="474" rx="8" class="box"/><rect x="49" y="601" width="878" height="44" rx="0" class="muted"/><text x="68" y="630" class="h">UNDRR</text><text x="616" y="629" class="small">Search   Language   Site menu</text><rect x="49" y="645" width="878" height="96" rx="0" class="accent"/><text x="68" y="678" class="h">Sendai Framework Monitor</text><text x="68" y="718" class="body">Overview</text><text x="183" y="718" class="body">About</text><text x="267" y="718" class="body">Indicators</text><text x="394" y="718" class="body">Reporting</text><text x="524" y="718" class="body">Reports</text><text x="627" y="718" class="body">Data</text><path d="M394 732 L478 732" class="line"/><text x="68" y="773" class="small">Home / Sendai Framework / Monitor / Reporting / How to report</text><text x="68" y="824" class="title">How to report</text><text x="68" y="858" class="body">An answer to a specific user need.</text><text x="682" y="822" class="label">ON THIS PAGE</text><text x="682" y="854" class="small">Reporting cycle</text><text x="682" y="883" class="small">Data validation</text><text x="682" y="912" class="small">Focal points</text><rect x="68" y="899" width="530" height="8" rx="3" class="muted"/><rect x="68" y="921" width="492" height="8" rx="3" class="muted"/><rect x="68" y="943" width="514" height="8" rx="3" class="muted"/><rect x="68" y="991" width="525" height="8" rx="3" class="muted"/><rect x="68" y="1013" width="481" height="8" rx="3" class="muted"/><path d="M652 803 L652 1032" class="line"/><rect x="953" y="603" width="31" height="31" rx="15" class="accent"/><text x="963" y="625" class="body">1</text><text x="999" y="625" class="h">Parent identity</text><text x="999" y="650" class="small">Keep ownership and an escape route.</text><text x="999" y="671" class="small">Compare full and compact navigation.</text><rect x="953" y="689" width="31" height="31" rx="15" class="accent"/><text x="963" y="711" class="body">2</text><text x="999" y="711" class="h">Hub navigation</text><text x="999" y="736" class="small">The persistent sideways route.</text><text x="999" y="757" class="small">Reporting stays active on descendants.</text><rect x="953" y="775" width="31" height="31" rx="15" class="accent"/><text x="963" y="797" class="body">3</text><text x="999" y="797" class="h">Ancestry</text><text x="999" y="822" class="small">Breadcrumbs locate the page.</text><text x="999" y="843" class="small">They do not replace sibling links.</text><rect x="953" y="861" width="31" height="31" rx="15" class="accent"/><text x="963" y="883" class="body">4</text><text x="999" y="883" class="h">Page content</text><text x="999" y="908" class="small">One clear page title.</text><text x="999" y="929" class="small">Contents links only when useful.</text><rect x="953" y="947" width="31" height="31" rx="15" class="accent"/><text x="963" y="969" class="body">5</text><text x="999" y="969" class="h">Deeper sections</text><text x="999" y="994" class="small">Use scoped sibling links or a rail.</text><text x="999" y="1015" class="small">Avoid a second full side rail.</text><text x="48" y="1124" class="h">Mobile: preserve the hierarchy, reduce the chrome</text><text x="48" y="1156" class="body">Test a short scrolling section strip against a labelled Sections disclosure when labels or depth grow.</text><text x="48" y="1185" class="small">Ordinary page links • visible active section • Arabic / RTL • one local navigation priority • no mandatory sticky stack</text></svg>