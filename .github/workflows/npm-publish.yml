name: Publish to NPM Registry

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v2.1.3, etc.)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g., v1.2.1, leave empty for latest tag)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Determine tag to use
        id: determine-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by tag push - use the pushed tag
            echo "Using pushed tag: ${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag }}" ]; then
            # Manual trigger with specific tag
            echo "Using provided tag: ${{ inputs.tag }}"
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # Manual trigger without tag - use latest
            latest_tag=$(git describe --tags --abbrev=0)
            echo "Using latest tag: $latest_tag"
            echo "tag=$latest_tag" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.determine-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@undrr'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # Assemble the curated npm-package/ directory (dist/ subpaths, SCSS
      # sources, slimmed package.json). The same script backs the local
      # `yarn pack:preview` and break-glass release docs (docs/RELEASES.md).
      - name: Prepare package files
        run: node scripts/assemble-npm-package.mjs npm-package

      - name: Publish to npm
        working-directory: npm-package
        run: |
          npm pkg set name="@undrr/undrr-mangrove"
          # A prerelease version (e.g. 2.0.0-alpha.1, anything with a hyphen)
          # must NOT take npm's default "latest" dist-tag, or a plain
          # `npm install @undrr/undrr-mangrove` would resolve to the unstable
          # build for every consumer. Publish prereleases under "next" instead;
          # only clean semver versions become "latest".
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "Prerelease version $version -> publishing with dist-tag 'next'"
            npm publish --access public --provenance --tag next
          else
            echo "Stable version $version -> publishing with dist-tag 'latest'"
            npm publish --access public --provenance
          fi
