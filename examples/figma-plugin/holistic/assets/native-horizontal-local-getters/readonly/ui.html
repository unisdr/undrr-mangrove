<!doctype html><meta charset="utf-8"><h2>Read-only Horizontal foundations</h2><p>Captures exact local getters and compares the pinned cloud baseline. No fonts loaded, assets changed, or values adopted.</p><button id="diagnose">Capture complete diagnostic</button><button id="download" disabled>Download full raw report</button><pre id="status"></pre><script>const capture=document.getElementById('diagnose'),download=document.getElementById('download'),statusOutput=document.getElementById('status');let retained=null;capture.onclick=()=>{capture.disabled=true;parent.postMessage({pluginMessage:{type:'diagnose'}},'*');};onmessage=e=>{const m=e.data.pluginMessage;if(m?.type!=='report')return;retained=m.reportJSON;try{const r=JSON.parse(retained);statusOutput.textContent=JSON.stringify({errors:r.errors||r.error,differences:r.exactFieldDifferences?.length,inventoryVerified:r.inventoryVerified},null,2);download.disabled=false;}catch(x){statusOutput.textContent=String(x);}capture.disabled=false;};download.onclick=()=>{let url;try{url=URL.createObjectURL(new Blob([retained],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='horizontal-readonly-local-foundation-diagnostic.json';a.click();}catch(e){statusOutput.textContent='Download failed; full report retained: '+String(e);}finally{if(url)URL.revokeObjectURL(url);}};</script>
