<!doctype html><meta charset="utf-8"><title>Whole Horizontal source rehearsal</title><style>body{font:14px system-ui;padding:16px}button,input,select{margin:8px 0}pre{white-space:pre-wrap;overflow:auto;max-height:180px}</style><h2>Whole Horizontal source rehearsal</h2><p>Eight HorizontalBookCard variants and all 23 linked EditorialCTA variants. Isolated unpublished file only. Preparation is blocked until native target pins and independent review are complete.</p><input type="file" id="source" accept="application/json,.json"><br><select id="brand"><option value="undrr">UNDRR</option><option value="delta">DELTA</option><option value="irp">IRP</option><option value="mcr">MCR</option><option value="preventionweb">PreventionWeb</option></select><br><button id="build" disabled>Build complete source scope</button><button id="download" disabled>Download complete report</button><pre id="status">Target unconfigured. Native execution blocked.</pre><script>
const sourceInput=document.getElementById('source'),buildButton=document.getElementById('build'),brandSelect=document.getElementById('brand'),downloadButton=document.getElementById('download'),statusOutput=document.getElementById('status');let sourceRaw=null,reportJSON=null;
sourceInput.onchange=async()=>{try{sourceRaw=await sourceInput.files[0].text();buildButton.disabled=false;}catch(e){statusOutput.textContent=String(e);}};
buildButton.onclick=()=>{buildButton.disabled=true;parent.postMessage({pluginMessage:{type:'build',sourceRaw,brand:brandSelect.value}},'*');};
onmessage=event=>{const m=event.data.pluginMessage;if(m?.type!=='report')return;reportJSON=m.reportJSON;try{const report=JSON.parse(reportJSON);statusOutput.textContent=JSON.stringify({errors:report.boundary?.errors||report.error,configured:report.configured,reportComplete:m.reportComplete},null,2);downloadButton.disabled=false;}catch(e){statusOutput.textContent='Report decode failed: '+String(e);}buildButton.disabled=false;};
downloadButton.onclick=()=>{let url;try{const a=document.createElement('a');url=URL.createObjectURL(new Blob([reportJSON],{type:'application/json'}));a.href=url;a.download='horizontal-whole-native-operation.json';a.click();}catch(e){statusOutput.textContent='Download failed; report retained in UI memory: '+String(e);}finally{if(url)URL.revokeObjectURL(url);}};
</script>
